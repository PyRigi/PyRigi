# Reusable workflow for one combination of OS and Python version:
# first, tests requiring optional extras are run (one job per extra);
# only if both pass, doctests and the documentation compilation are run.

name: Workflow-extras-and-doc

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string
      ref:
        description: Git ref to check out (empty means the triggering ref)
        required: false
        type: string
        default: ''
      dependencies:
        description: locked, latest, minimal or pip (see .github/actions/setup)
        required: false
        type: string
        default: locked
      pytest-options:
        description: Additional options for pytest calls
        required: false
        type: string
        default: ''
      remove-skip-execution:
        description: Remove the skip-execution cell magic so that the notebooks are executed in the doc build
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: Timeout of each job
        required: false
        type: number
        default: 15

permissions:
  contents: read

jobs:
  extras:
    name: Test extra ${{ matrix.extras }}
    strategy:
      fail-fast: false
      matrix:
        extras: ["lnumber", "meshing"]
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - uses: ./.github/actions/setup
      with:
        python-version: ${{ inputs.python-version }}
        dependencies: ${{ inputs.dependencies }}
        install-args: --extras ${{ matrix.extras }}
        pip-extras: ${{ matrix.extras }}
    - name: Test functions requiring extra ${{ matrix.extras }}
      shell: bash
      run: |
        if [ "${{ matrix.extras }}" == "lnumber" ]; then
          poetry run pytest ${{ inputs.pytest-options }} test/graph/rigidity/test_realization_counting.py
        elif [ "${{ matrix.extras }}" == "meshing" ]; then
          poetry run pytest ${{ inputs.pytest-options }} test/framework/export/test_export.py
        fi

  doc:
    name: Test doctests and documentation
    needs: extras
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - uses: ./.github/actions/setup
      with:
        python-version: ${{ inputs.python-version }}
        dependencies: ${{ inputs.dependencies }}
        install-args: --all-extras
        pip-extras: lnumber,meshing
    - name: Test all doctests with pytest
      shell: bash
      run: |
        poetry run pytest --doctest-modules pyrigi
        # --doctest-modules overrides the default --doctest-plus,
        # hence, all doctests are tested (also those requiring extras).
    - uses: ./.github/actions/convert-notebooks
      with:
        remove-skip-execution: ${{ inputs.remove-skip-execution }}
    - name: Test doc compilation
      shell: bash
      run: |
        cd doc
        poetry run make SPHINXOPTS=--fail-on-warning html
