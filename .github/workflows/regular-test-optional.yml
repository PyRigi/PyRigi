# This workflow will install Python dependencies and
# run corresponding tests with each extra
# installed with the latest versions of Python from 3.11 till 3.15
# on Linux, Windows and MacOS

name: Regular-extras

on:
  push:
    branches: [ "dev", "epic-*" ]
  pull_request:
    branches: [ "dev", "epic-*" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        extras: ["lnumber", "meshing"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
    - name: Install poetry
      run: pipx install poetry
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'poetry'
    - name: Install dependencies
      shell: bash
      run: poetry install --extras ${{ matrix.extras }}
    - name: Test functions requiring extra ${{ matrix.extras }}
      shell: bash
      run: |
        if [ "${{ matrix.extras }}" == "lnumber" ]; then
          poetry run pytest test/graph/rigidity/test_realization_counting.py
        elif [ "${{ matrix.extras }}" == "meshing" ]; then
          poetry run pytest test/framework/export/test_export.py
        fi