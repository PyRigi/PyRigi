# This workflow runs, for each combination of OS and Python version from 3.12 till 3.15,
# with the latest possible versions of the dependencies (poetry.lock is ignored),
# the tests of optional extras and, only if they pass for that same combination,
# the doctests and the documentation compilation including executing the notebooks,
# analogously to python-test-main.yml (see workflow-extras-and-doc.yml).
# It runs every Thursday on main and on demand on any branch.

name: Regular-other-main

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to test (scheduled runs always test the default branch, main)
        type: string
        default: main
  schedule:
    # Every Thursday at 05:17 UTC
    - cron: '17 5 * * 4'

permissions:
  contents: read

jobs:
  regular:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    uses: ./.github/workflows/workflow-extras-and-doc.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      # empty (scheduled runs) means the default branch, main
      ref: ${{ inputs.branch }}
      dependencies: latest
      pytest-options: "-m 'not long_local' --graph-class=both"
      execute-notebooks: true
      timeout-minutes: 60
