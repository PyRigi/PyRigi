# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Pytest-dev

on:
  push:
    branches: [ "dev", "epic-*" ]
  pull_request:
    branches: [ "dev", "epic-*" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        python-version: "3.12"
        install-args: --all-extras
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        poetry run flake8 . --count --show-source --statistics
    - name: Test with pytest
      run: |
        poetry run pytest --doctest-modules
        # --doctest-modules overrides the default --doctest-plus
    - uses: ./.github/actions/convert-notebooks
    - name: Test doc compilation
      run: |
        cd doc
        poetry run make SPHINXOPTS=--fail-on-warning html
    - name: Test without lnumber
      run: |
        poetry sync
        poetry run pytest -m "not lnumber"  test/graph/rigidity/test_realization_counting.py