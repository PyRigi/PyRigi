# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Pytest-dev

on:
  push:
    branches: [ "dev", "epic-*" ]
  pull_request:
    branches: [ "dev", "epic-*" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
    - name: Install poetry
      run: pipx install poetry
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'poetry'
    - name: Set extras and pytest marker depending on OS
      # Extra lnumber is only installed and tested on Linux!
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          echo "EXTRAS=--all-extras" >> "$GITHUB_ENV"
          echo "PYTEST_MARKER=" >> "$GITHUB_ENV"
        else
          echo "EXTRAS=--extras meshing" >> "$GITHUB_ENV"
          echo "PYTEST_MARKER=not lnumber" >> "$GITHUB_ENV"
        fi
    - name: Install dependencies
      shell: bash
      run: poetry install $EXTRAS
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        poetry run flake8 . --count --show-source --statistics
    - name: Test with pytest
      shell: bash
      run: |
        poetry run pytest --doctest-modules ${PYTEST_MARKER:+-m "$PYTEST_MARKER"}
        # --doctest-modules overrides the default --doctest-plus
    - name: Convert notebooks from md to ipynb
      run: |
        cd doc/userguide/tutorials/
        poetry run jupytext --to notebook  *.md
        mkdir  --verbose ../../notebooks
        cp --verbose *.ipynb ../../notebooks
        cd ..
        poetry run jupytext --to notebook  getting_started.md
        cp --verbose getting_started.ipynb ../notebooks
    - name: Test doc compilation
      run: |
        cd doc
        poetry run make SPHINXOPTS=--fail-on-warning html
    - name: Test without lnumber
      run: |
        poetry sync
        poetry run pytest -m "not lnumber"  test/graph/rigidity/test_realization_counting.py
