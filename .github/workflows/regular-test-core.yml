# This workflow will install Python dependencies, lint and
# run tests without any extras with the latest versions of Python from 3.11 till 3.15
# on Linux, Windows and MacOS
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Regular-core

on:
  push:
    branches: [ "dev", "epic-*" ]
  pull_request:
    branches: [ "dev", "epic-*" ]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Use the non-interactive Agg backend of matplotlib: plots are only created, never shown.
      # Otherwise, on Windows the default TkAgg backend sometimes fails to find Tcl/Tk
      # ("Can't find a usable init.tcl"), making plotting tests fail randomly.
      MPLBACKEND: Agg

    steps:
    - uses: actions/checkout@v4
    - name: Install poetry
      run: pipx install poetry
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'poetry'
    - name: Install dependencies
      shell: bash
      run: poetry install
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        poetry run flake8 . --count --show-source --statistics
    - name: Test core with pytest
      run: poetry run pytest -m "not lnumber and not meshing and not slow_main and not long_local"
        # doctests are run by doctest-plus (enabled in pyproject.toml),
        # which skips those whose __doctest_requires__ packages are missing