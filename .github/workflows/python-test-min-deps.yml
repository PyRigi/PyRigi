# Tests the package with the lowest versions of its direct dependencies
# allowed by pyproject.toml, to verify that the declared lower bounds are correct.

name: Pytest-min-dependencies

on:
  push:
    branches: [ "main", "dev", "epic-*" ]
  pull_request:
    branches: [ "main", "dev", "epic-*" ]
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version (other triggers always use 3.12)
        type: choice
        options: ["3.12", "3.13", "3.14", "3.15"]
        default: "3.12"
  schedule:
    # Every Sunday at 20:00 UTC (GitHub cron runs in UTC)
    - cron: "0 20 * * 0"

permissions:
  contents: read

jobs:
  test-min-deps:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Install poetry
      run: pipx install poetry
    - name: Set up Python ${{ inputs.python-version || '3.12' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version || '3.12' }}
    - name: Pin direct dependencies to their lower bounds
      run: |
        # Poetry cannot resolve to the lowest versions, so we turn every
        # "package>=X" requirement into "package==X" (this does not touch
        # requires-python, since it has no package name in front of ">=").
        # Transitive dependencies are still resolved to their latest versions.
        sed -i.bak -E 's/"([A-Za-z0-9_.-]+)>=/"\1==/g' pyproject.toml
        rm -f pyproject.toml.bak
        git diff pyproject.toml
        rm -f poetry.lock
        poetry lock
    - name: Install dependencies
      run: poetry install --all-extras
    - name: Show installed versions
      run: poetry run pip list
    - name: Test with pytest
      run: |
        poetry run pytest --doctest-modules
        # --doctest-modules overrides the default --doctest-plus
    - name: Test without optional dependencies
      run: |
        poetry sync
        poetry run pytest -m "not lnumber" test/graph/rigidity/test_realization_counting.py
