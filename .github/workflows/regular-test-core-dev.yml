# This workflow lints and runs tests without any extras with the latest versions of Python
# from 3.12 till 3.15 on Linux, Windows and MacOS, with locked and with minimal dependencies
# (see workflow-core.yml).
# It runs on pushes and pull requests to dev, every Monday on dev, and on demand on any branch.

name: Regular-core-dev

on:
  push:
    branches: [ "dev", "epic-*" ]
  pull_request:
    branches: [ "dev", "epic-*" ]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to test (scheduled runs always test dev)
        type: string
        default: dev
  schedule:
    # Every Monday at 02:17 UTC
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        dependencies: [locked, minimal]
    name: Test core-dev on ${{ matrix.os }}, Python ${{ matrix.python-version }} with ${{ matrix.dependencies }} dependencies
    uses: ./.github/workflows/workflow-core.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      # scheduled runs test dev (the default branch is main),
      # manual runs test the chosen branch, other triggers the triggering ref
      ref: ${{ github.event_name == 'schedule' && 'dev' || inputs.branch }}
      dependencies: ${{ matrix.dependencies }}
